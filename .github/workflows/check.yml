name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make test check
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o bin/agent-linux-guest ./cmd/agent-linux-guest
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o bin/agent-linux ./cmd/agent-linux
      - name: Build unpublished unsigned local candidate (no upload)
        run: |
          python3 scripts/package.py --output artifacts/ci-package
          python3 scripts/check_bundle.py artifacts/ci-package/agent-linux-0.5.0-rc.1-darwin-arm64
