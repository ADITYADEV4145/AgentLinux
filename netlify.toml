[build]
  command = "python3 scripts/build_site.py"
  publish = "dist/netlify"

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/pricing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pricing/"
  to = "/pricing"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/get-started/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"
